<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uno o dos meses del plan Pro</title>
<meta name="description" content="El juego está en su base. Claude lo impulsará a la luna.">
<style>
  :root {
    --bg: #080806;
    --ink: #e8e1d6;
    --dim: #8c8174;
    --line: #3a342c;
    --mark: #c4a36a;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.45;
  }

  .wrap {
    max-width: 42rem;
    margin: 0 auto;
    padding: 4.5rem 1.35rem 5rem;
  }

  h1, h2 {
    font-family: var(--serif);
    font-weight: 500;
    line-height: 1.15;
    color: #f3ece3;
  }

  h1 {
    font-size: 2.35rem;
    margin: 0.35rem 0 0.85rem;
  }

  h2 {
    margin: 0 0 0.85rem;
    font-size: 1.05rem;
    color: var(--mark);
  }

  .kicker {
    margin: 0;
    font-family: var(--serif);
    font-size: 0.95rem;
    color: var(--mark);
  }

  .lead {
    margin: 0 0 2.25rem;
    max-width: 34rem;
  }

  .scheme {
    margin: 0 0 0.85rem;
    font-family: var(--serif);
    font-size: 1.05rem;
    color: var(--mark);
  }

  .month + .month { margin-top: 1.85rem; }

  ul {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.85rem;
    margin: 0;
    padding: 0;
  }

  li {
    margin: 0;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 0 0.55rem;
    color: var(--mark);
  }

  li span {
    display: block;
    font-size: 0.92rem;
    line-height: 1.3;
  }

  @media (max-width: 640px) {
    .wrap { padding: 2.75rem 1.1rem 4rem; }
    h1 { font-size: 1.85rem; }
    ul { grid-template-columns: repeat(2, 1fr); gap: 1.15rem 0.75rem; }
  }
</style>
</head>
<body>
<main class="wrap">

  <header>
    <p class="kicker">Claude Pro</p>
    <h1>Uno o dos meses</h1>
    <p class="lead">El juego está en su base. Claude lo impulsará a la luna.</p>
  </header>

  <p class="scheme">Esto es lo que Claude haría</p>

  <section class="month">
    <h2>Mes 1</h2>
    <ul>
      <li>
        <svg viewBox="0 0 80 64" aria-hidden="true">
          <path fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M40 8 L62 20 L62 44 L40 56 L18 44 L18 20 Z"/>
          <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M40 8 L40 32 L18 20 M40 32 L62 20 M40 32 L40 56"/>
        </svg>
        <span>Mallas y materiales</span>
      </li>
      <li>
        <svg viewBox="0 0 80 64" aria-hidden="true">
          <circle cx="34" cy="14" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M34 19 L34 36 M34 24 L22 32 M34 24 L48 20 M34 36 L20 52 M34 36 L50 48"/>
          <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M52 18c4 2 6 6 4 10"/>
        </svg>
        <span>Animación</span>
      </li>
      <li>
        <svg viewBox="0 0 80 64" aria-hidden="true">
          <rect x="12" y="8" width="56" height="48" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M40 26 V38 M34 32 H46"/>
          <rect x="18" y="46" width="16" height="3" fill="currentColor" fill-opacity="0.45"/>
          <rect x="36" y="46" width="10" height="3" fill="currentColor" fill-opacity="0.2"/>
        </svg>
        <span>HUD</span>
      </li>
      <li>
        <svg viewBox="0 0 80 64" aria-hidden="true">
          <path fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M14 28 H24 L38 16 V48 L24 36 H14 Z"/>
          <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M46 26c4 3 4 9 0 12 M52 20c8 5 8 19 0 24"/>
        </svg>
        <span>Audio</span>
      </li>
    </ul>
  </section>

  <section class="month">
    <h2>Mes 2</h2>
    <ul>
      <li>
        <svg viewBox="0 0 80 64" aria-hidden="true">
          <circle cx="54" cy="16" r="5" fill="currentColor" fill-opacity="0.2" stroke="currentColor" stroke-width="1.6"/>
          <path fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M8 46 L22 30 L34 42 L48 26 L72 48 V56 H8 Z"/>
        </svg>
        <span>Mundo</span>
      </li>
      <li>
        <svg viewBox="0 0 80 64" aria-hidden="true">
          <path fill="currentColor" fill-opacity="0.14" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M16 30 L40 14 L64 30 V54 H16 Z"/>
          <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M34 54 V40 H46 V54"/>
        </svg>
        <span>Construcción</span>
      </li>
      <li>
        <svg viewBox="0 0 80 64" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M14 40 H66 M22 40 V54 M58 40 V54"/>
          <path fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M30 36 L46 22 L54 30 L38 44 Z"/>
          <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M24 34 L40 18"/>
        </svg>
        <span>Crafteo</span>
      </li>
      <li>
        <svg viewBox="0 0 80 64" aria-hidden="true">
          <rect x="14" y="10" width="52" height="44" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M28 28 H52 M32 36 H48"/>
        </svg>
        <span>Título</span>
      </li>
    </ul>
  </section>

</main>
</body>
</html>
